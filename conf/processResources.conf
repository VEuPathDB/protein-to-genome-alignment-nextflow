// Process CPU/memory requirements, expressed in portable Nextflow syntax (no bsub
// strings here) so this file works unchanged under any executor (LSF, Slurm, ...).
// Executor-specific submission flags belong in conf/lsf.config (or its future
// Slurm equivalent) instead. Values mirror the defaults ApiCommonWorkflow's
// MakeProteinAlignConfig.pm step passes in production (exonerateMemory = 2 GB,
// escalating 1x/2x/5x across retries).
process {
    withName: 'exonerate' {
        maxForks = 20
        maxRetries = 2
        errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'terminate' }
        memory = { task.attempt == 1 ? '2 GB' : task.attempt == 2 ? '4 GB' : '10 GB' }
    }
}
